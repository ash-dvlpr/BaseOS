# BaseOS mDNS configuration: publish ONLY the device's <hostname>.local
# A/AAAA + reverse records. No D-Bus is compiled in, so no service
# announcements can exist at all; the flags below additionally disable every
# host-related extra record (hinfo/workstation/domain/dns-servers).
#
# host-name is intentionally unset: avahi announces the kernel hostname,
# which rcS sets from /data/hostname (rename_hostname feature) before avahi
# starts.
[server]
use-ipv4=yes
use-ipv6=yes
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[reflector]
enable-reflector=no

[publish]
publish-hinfo=no
publish-workstation=no
publish-domain=no
publish-dns-servers=no
publish-resolv-conf-dns-servers=no